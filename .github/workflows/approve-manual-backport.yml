name: Approve manual backport

# Uses pull_request_target so approvals can use REPO_SCOPED_TOKEN; only runs
# checked-in validation logic (not code from the PR branch).
# Applies to every maintenance branch (X.Y); the patch label required on the
# source PR is derived from the base branch. The validator is always taken from
# the default branch, so maintenance branches cannot drift from it.
#
# The PR author must also be an active member of one of ALLOWED_TEAMS. Set the
# repository variable BACKPORT_APPROVER_TEAMS (comma separated team slugs) to
# change the default. The team lookup uses REPO_SCOPED_TOKEN, which needs org
# read access; if membership cannot be verified the job fails and nothing is
# approved.
on:
  pull_request_target:
    branches-ignore:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: approve-manual-backport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false

      - name: Validate backport PR
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOWED_TEAMS: ${{ vars.BACKPORT_APPROVER_TEAMS || 'search-extract-and-transform,enterprise-search' }}
          TEAM_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
        run: python3 .github/workflows/scripts/validate_manual_backport.py

      - name: Approve
        if: steps.validate.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          APPROVED=$(gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" \
            --json reviews --jq '[.reviews[] | select(.author.login == "entsearchmachine" and .state == "APPROVED")] | length')
          if [ "${APPROVED}" != "0" ]; then
            echo "Already approved by entsearchmachine; skipping."
            exit 0
          fi
          gh api \
            --method POST \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE

      # Only reached for PRs whose author passed the team check above. Auto-merge
      # still waits for the required checks.
      - name: Enable auto-merge
        if: steps.validate.outputs.approved == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          DEFAULT_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/workflows/scripts/enable_auto_merge.sh "${PR_NUMBER}"

name: Force backport labels for main

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened

# Reads maintenance branch list from .backportrc.json (maintenanceBranches).
permissions:
  contents: read
  pull-requests: write

jobs:
  add_labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build label list
        id: labels
        run: |
          set -euo pipefail

          version_file_for_branch() {
            case "$1" in
              8.*|9.0|9.1|9.2|9.3) echo "connectors/VERSION" ;;
              *) echo "app/connectors_service/connectors/VERSION" ;;
            esac
          }

          mapfile -t maintenance_branches < <(jq -r '.maintenanceBranches[]' .backportrc.json)
          if [ "${#maintenance_branches[@]}" -eq 0 ]; then
            echo "maintenanceBranches is empty in .backportrc.json" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin main "${maintenance_branches[@]}"

          main_version=$(tr -d '[:space:]' < app/connectors_service/connectors/VERSION)

          {
            echo 'labels<<EOF'
            echo 'auto-backport'
            echo "v${main_version}"
            for branch in "${maintenance_branches[@]}"; do
              version_file=$(version_file_for_branch "${branch}")
              branch_version=$(git show "origin/${branch}:${version_file}" | tr -d '[:space:]')
              echo "v${branch_version}"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: ${{ steps.labels.outputs.labels }}

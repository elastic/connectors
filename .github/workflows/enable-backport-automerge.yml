name: Enable auto-merge on approved backport

# The backport action tries to enable auto-merge before it approves the PR,
# which fails ("Could not enable auto merging"). Enable it once the approval
# exists. The approval is made with a PAT (entsearchmachine), so it fires this
# event; events caused by GITHUB_TOKEN would not start a workflow.
#
# Runs on same-repo branches only (fork PRs get a read-only token and no
# secrets). Auto-merge waits for the required checks, so none are checked here.
# Note: the ruleset requires branches to be up to date; a backport that falls
# behind its base will not merge until it is updated (or a merge queue is on).
on:
  pull_request_review:
    types:
      - submitted
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: enable-backport-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      github.event.review.state == 'approved'
      && github.event.review.user.login == 'entsearchmachine'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'backport')
      && !github.event.pull_request.auto_merge
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge for maintenance branches
        env:
          GH_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ! [[ "${BASE_REF}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Base '${BASE_REF}' is not a maintenance branch; skipping."
            exit 0
          fi
          gh pr merge "${PR_NUMBER}" --auto --squash

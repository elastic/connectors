name: Mechanical auto-approve metrics

# Weekly numbers for the mechanical auto-approve rollout: how many PRs merged,
# how many were approved by the bot, and how many revert PRs landed.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize last 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --base main --limit 200 \
            --search "merged:>=${SINCE}" \
            --json number,title,reviews,labels > prs.json
          {
            echo "## Mechanical auto-approve, merged since ${SINCE}"
            echo
            echo "- Merged PRs: $(jq 'length' prs.json)"
            echo "- Labelled mechanical-pr: $(jq '[.[] | select(any(.labels[]; .name == "mechanical-pr"))] | length' prs.json)"
            echo "- Approved by entsearchmachine: $(jq '[.[] | select(any(.reviews[]; .author.login == "entsearchmachine" and .state == "APPROVED"))] | length' prs.json)"
            echo "- Revert PRs merged (check by hand whether any undo a bot-approved PR): $(jq '[.[] | select(.title | startswith("Revert"))] | length' prs.json)"
          } >> "$GITHUB_STEP_SUMMARY"

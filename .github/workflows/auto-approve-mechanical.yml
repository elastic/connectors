name: Auto-approve mechanical PRs

# Approves Renovate Wolfi digest bumps, CVE pin bumps and release version bumps
# to main. Rules and checks: .github/workflows/scripts/validate_mechanical_pr.py,
# always read from the default branch, never from the PR. Details: docs/CONTRIBUTING.md.
#
# Re-runs when CLA or Buildkite turns green, because approval needs green CI.
# To turn this off, open a PR that removes this workflow.
# Repository variable BACKPORT_APPROVER_TEAMS (comma separated team slugs, default
# search-extract-and-transform) lists who may author the team categories.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  status:

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  evaluate:
    name: Mechanical auto-approve
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'status'
        && github.event.state == 'success'
        && (github.event.context == 'CLA' || github.event.context == 'buildkite/connectors'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/workflows/scripts

      - name: Check and approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
          ALLOWED_TEAMS: ${{ vars.BACKPORT_APPROVER_TEAMS || 'search-extract-and-transform' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS_SHA: ${{ github.event.sha }}
        run: python3 .github/workflows/scripts/validate_mechanical_pr.py
